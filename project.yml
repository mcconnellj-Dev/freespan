name: Freespan
options:
  bundleIdPrefix: com.mcconnelldigital
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  FreespanKit:
    path: FreespanKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Freespan:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: FreespanKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Freespan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 McConnell Digital"
    entitlements:
      path: App/Freespan.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcconnelldigital.Freespan
        DEVELOPMENT_TEAM: V6G6AT4HY5
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
